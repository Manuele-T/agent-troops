name: agent-troops audit
description: Check a repository's Claude Code agents, hooks, MCP servers and skills for known attack patterns (offline, no model, no key)
author: Manuele-T
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Folder to audit, relative to the workspace
    required: false
    default: "."
  fail-on:
    description: "When the step fails: fail (a FAIL finding), warn (a WARN or FAIL), never (report only)"
    required: false
    default: fail
  python-version:
    description: Python used to run the audit (3.11 or later)
    required: false
    default: "3.12"

outputs:
  result:
    description: "The overall result: PASS, WARN, FAIL or NO AGENTS"
    value: ${{ steps.audit.outputs.result }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # The tool comes from this action's own checkout (the tag you pinned), not from a package index.
    - name: Install agent-troops
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"

    # Inputs reach the script as environment variables, never pasted into it.
    - name: Audit
      id: audit
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        report="$RUNNER_TEMP/agent-troops-audit.md"
        set +e
        team-build --audit "$TARGET" --report "$report" --fail-on "$FAIL_ON" | tee "$RUNNER_TEMP/agent-troops-audit.txt"
        status=${PIPESTATUS[0]}
        set -e
        result=$(sed -n 's/^overall: //p' "$RUNNER_TEMP/agent-troops-audit.txt" | tail -n 1)
        if [ -z "$result" ]; then
          if [ "$status" -eq 0 ]; then result="NO AGENTS"; else result="ERROR"; fi
        fi
        echo "result=$result" >> "$GITHUB_OUTPUT"
        if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
        exit "$status"
